      <path d="M56 328.15999999999997 C348.16 192.25999999999996 666.88 388.55999999999995 932.48 291.91999999999996 S1251.2 237.55999999999997 1384 319.09999999999997 V455 H56Z" fill="#426578" opacity="0.38"/>
