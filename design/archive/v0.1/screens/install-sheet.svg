    <text x="56" y="605" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Access</text>
    <text x="246" y="605" font-size="18" font-weight="500" fill="#202126" text-anchor="start">Purchased</text>
    <path d="M56 625H716" stroke="#d8dbe0"/>
    <text x="56" y="661" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Downloadability</text>
    <text x="246" y="661" font-size="18" font-weight="500" fill="#202126" text-anchor="start">PC package available</text>
    <path d="M56 681H716" stroke="#d8dbe0"/>
    <text x="56" y="717" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Compatibility</text>
    <text x="246" y="717" font-size="18" font-weight="500" fill="#202126" text-anchor="start">Verified (invented fixture evidence)</text>
    <path d="M56 737H716" stroke="#d8dbe0"/>
    <text x="56" y="773" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">This Mac</text>
    <text x="246" y="773" font-size="18" font-weight="500" fill="#202126" text-anchor="start">Not installed</text>
    <path d="M56 793H716" stroke="#d8dbe0"/>
    <text x="56" y="850" font-size="15" font-weight="400" fill="#5a5e68" text-anchor="start">Evidence: invented, fixed scenario time; fixture OS / arm64 / fixture-xodus-pair-1.</text>
    <text x="56" y="880" font-size="15" font-weight="400" fill="#5a5e68" text-anchor="start">Product, edition and package IDs remain distinct. Nothing shown is a live entitlement.</text>
    <text x="868" y="606" font-size="24" font-weight="600" fill="#202126" text-anchor="start">Review before you begin</text>
    <text x="868" y="648" font-size="18" font-weight="400" fill="#5a5e68" text-anchor="start">4 GB download  /  8 GB expanded</text>
    <text x="868" y="686" font-size="18" font-weight="400" fill="#5a5e68" text-anchor="start">Requires an exact runtime pair.</text>
    <rect x="868" y="722" width="256" height="42" rx="8" fill="#225dc2"/>
    <text x="996.0" y="749" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Review fixture install</text>
    <rect x="0" y="123" width="1440" height="857" rx="0" fill="#202126" opacity=".25"/>
    <rect x="365" y="180" width="710" height="662" rx="16" fill="#ffffff"/>
    <text x="403" y="219" font-size="15" font-weight="400" fill="#5a5e68" text-anchor="start">Fixture preview - no files will be written</text>
    <text x="403" y="272" font-size="32" font-weight="700" fill="#202126" text-anchor="start">Review fixture install</text>
    <text x="403" y="310" font-size="19" font-weight="600" fill="#202126" text-anchor="start">Paper Ridge  /  Standard edition</text>
    <path d="M403 336H1037" stroke="#d8dbe0"/>
    <text x="403" y="370" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Download</text>
    <text x="710" y="370" font-size="17" font-weight="400" fill="#202126" text-anchor="start">4 GB</text>
    <text x="403" y="404" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Expanded game</text>
    <text x="710" y="404" font-size="17" font-weight="400" fill="#202126" text-anchor="start">8 GB</text>
    <text x="403" y="438" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Staging</text>
    <text x="710" y="438" font-size="17" font-weight="400" fill="#202126" text-anchor="start">4 GB</text>
    <text x="403" y="472" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Safety reserve</text>
    <text x="710" y="472" font-size="17" font-weight="400" fill="#202126" text-anchor="start">2 GB</text>
    <text x="403" y="506" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Required free</text>
    <text x="710" y="506" font-size="17" font-weight="600" fill="#202126" text-anchor="start">14 GB</text>
    <text x="403" y="540" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Available (simulated)</text>
    <text x="710" y="540" font-size="17" font-weight="400" fill="#202126" text-anchor="start">120 GB</text>
    <text x="403" y="574" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Destination</text>
    <text x="710" y="574" font-size="17" font-weight="400" fill="#202126" text-anchor="start">Demo storage / Games</text>
    <text x="403" y="608" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Package version</text>
    <text x="710" y="608" font-size="17" font-weight="400" fill="#202126" text-anchor="start">1.0-demo</text>
    <text x="403" y="642" font-size="17" font-weight="400" fill="#5a5e68" text-anchor="start">Runtime pair</text>
    <text x="710" y="642" font-size="17" font-weight="400" fill="#202126" text-anchor="start">fixture-xodus-pair-1</text>
    <text x="403" y="710" font-size="16" font-weight="400" fill="#5a5e68" text-anchor="start">Simulated space check. No download or install is performed.</text>
